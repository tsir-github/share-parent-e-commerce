mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.share.**.domain
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: flag
      logic-delete-value: 2
      logic-not-delete-value: 0
spring:
  redis:
    sentinel:
      master: mymaster
      nodes: 192.168.10.129:26379,192.168.10.129:26380,192.168.10.129:26381
    password: ShareRedis2024!
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/share-order?characterEncoding=utf-8&useSSL=false
    username: root
    password: root
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 60000
      idle-timeout: 500000
      max-lifetime: 540000
      maximum-pool-size: 10
      minimum-idle: 5
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8718
        port: 8719
      datasource:
        ds-flow:
          nacos:
            server-addr: 192.168.10.129:8848
            namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
            data-id: ${spring.application.name}-sentinel-flow.json
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: 192.168.10.129:8848
            namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
            data-id: ${spring.application.name}-sentinel-degrade.json
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: degrade
rocketmq:
  name-server: 192.168.10.129:9876
  producer:
    group: share-order-producer
seata:
  application-id: share-order
  tx-service-group: share-order-group
  registry:
    type: nacos
    nacos:
      server-addr: 192.168.10.129:8848
      namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
      cluster: default