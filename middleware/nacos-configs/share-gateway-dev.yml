spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8718
        port: 8719
      scg:
        fallback:
          mode: response
          response-status: 429
          response-body: '{"code":429,"msg":"请求过于频繁，请稍候再试"}'
      datasource:
        ds-flow:
          nacos:
            server-addr: 192.168.10.129:8848
            namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
            data-id: ${spring.application.name}-sentinel-flow.json
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: 192.168.10.129:8848
            namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
            data-id: ${spring.application.name}-sentinel-degrade.json
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: degrade
        ds-gw-flow:
          nacos:
            server-addr: 192.168.10.129:8848
            namespace: a746e297-417e-4aec-bfb1-e42df33fbe93
            data-id: ${spring.application.name}-sentinel-gw-flow.json
            group-id: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
